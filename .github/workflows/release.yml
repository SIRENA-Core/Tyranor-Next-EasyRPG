name: Release EasyRPG Host APK

on:
  push:
    tags:
      - 'easyrpg-host-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ABIS: armeabi-v7a,arm64-v8a,x86_64
      NDK_VERSION: 28.2.13676358

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify clean upstream submodules
        run: |
          test -z "$(git -C third_party/Player status --porcelain)"
          test -z "$(git -C third_party/buildscripts status --porcelain)"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            cmake ninja-build meson \
            curl unzip perl patch python3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      - name: Cache prebuilt toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            .toolchains/arm64-v8a-toolchain
            .toolchains/armeabi-v7a-toolchain
            .toolchains/x86_64-toolchain
            .toolchains/downloads
          key: easyrpg-toolchains-${{ runner.os }}-${{ hashFiles('.git/modules/third_party/buildscripts/HEAD', 'scripts/build_toolchain.sh') }}

      - name: Build Android dependency toolchains
        run: ./scripts/build_toolchain.sh --abis "${ABIS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Prepare signing keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Tyranor-Next-EasyRPG.apk

      - name: Verify release APK
        run: ./scripts/verify_release_apk.sh dist/Tyranor-Next-EasyRPG.apk

      - name: Verify release tag matches versionName
        if: startsWith(github.ref, 'refs/tags/easyrpg-host-')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#easyrpg-host-}"
          APP_VERSION="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Tag version: ${TAG_VERSION}, APK versionName: ${APP_VERSION}"
          test "${TAG_VERSION}" = "${APP_VERSION}"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/easyrpg-host-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tyranor-Next-EasyRPG.apk
          draft: false
          prerelease: false
          generate_release_notes: true

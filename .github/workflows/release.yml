name: Release EasyRPG Host APK

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-easyrpg-host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-change:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect app version change
        id: version
        run: |
          code_of() {
            local cleaned major=0 minor=0 patch=0 _
            cleaned="$(printf '%s' "$1" | sed -E 's/^[^0-9]*//; s/[^0-9.].*$//')"
            IFS=. read -r major minor patch _ <<< "${cleaned}"
            echo $(( ${major:-0} * 1000000 + ${minor:-0} * 1000 + ${patch:-0} ))
          }

          extract_name() {
            local content="$1" name=""
            if [[ -n "${content}" ]]; then
              name="$(printf '%s\n' "${content}" | grep -E '^[[:space:]]*val appVersionName[[:space:]]*=' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
              if [[ -z "${name}" ]]; then
                name="$(printf '%s\n' "${content}" | grep -E '^[[:space:]]*versionName[[:space:]]*=' | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
              fi
            fi
            printf '%s' "${name}"
          }

          new_file="$(cat app/build.gradle.kts)"
          new_name="$(extract_name "${new_file}")"
          if [[ -z "${new_name}" ]]; then
            echo "::error::Missing val appVersionName in app/build.gradle.kts"
            exit 1
          fi
          new_code="$(code_of "${new_name}")"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch requested for ${new_name} (${new_code})."
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            echo "version_name=${new_name}" >> "${GITHUB_OUTPUT}"
            echo "version_code=${new_code}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "${before}" || "${before}" == "0000000000000000000000000000000000000000" ]]; then
            before="${after}^"
          fi

          old_file="$(git show "${before}:app/build.gradle.kts" 2>/dev/null || true)"
          old_name="$(extract_name "${old_file}")"

          if [[ -z "${old_name}" ]]; then
            echo "::warning::Previous app/build.gradle.kts version not found; proceeding with ${new_name} (${new_code})."
          elif [[ "${old_name}" == "${new_name}" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          else
            old_code="$(code_of "${old_name}")"
            if (( new_code <= old_code )); then
              echo "::error::versionCode must strictly increase: ${old_name}(${old_code}) -> ${new_name}(${new_code})"
              exit 1
            fi
            echo "versionName ${old_name} -> ${new_name}, versionCode ${old_code} -> ${new_code}"
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "version_name=${new_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${new_code}" >> "${GITHUB_OUTPUT}"

  build-and-release:
    name: Build and Release APK
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABIS: armeabi-v7a,arm64-v8a,x86_64
      NDK_VERSION: 28.2.13676358

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify clean upstream submodules
        run: |
          test -z "$(git -C third_party/Player status --porcelain)"
          test -z "$(git -C third_party/buildscripts status --porcelain)"

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            cmake ninja-build meson \
            curl unzip perl patch python3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          packages=("platforms;android-37.0" "build-tools;36.0.0" "cmake;3.22.1" "ndk;${NDK_VERSION}")
          for attempt in 1 2 3; do
            if sdkmanager --channel=3 "${packages[@]}"; then
              exit 0
            fi
            echo "::warning::sdkmanager install failed (attempt ${attempt}/3); retrying..."
            rm -rf "${ANDROID_HOME}/.temp" "${ANDROID_HOME}/.downloadIntermediates"
            sleep $((attempt * 15))
          done
          echo "::error::Failed to install Android SDK/NDK packages"
          exit 1

      - name: Cache prebuilt toolchains
        id: cache-toolchains
        uses: actions/cache@v4
        with:
          path: |
            .toolchains/arm64-v8a-toolchain
            .toolchains/armeabi-v7a-toolchain
            .toolchains/x86_64-toolchain
            .toolchains/downloads
          key: easyrpg-toolchains-${{ runner.os }}-${{ hashFiles('.git/modules/third_party/buildscripts/HEAD', 'scripts/build_toolchain.sh') }}

      - name: Build Android dependency toolchains
        run: ./scripts/build_toolchain.sh --abis "${ABIS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Prepare signing keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" && -n "${ANDROID_KEYSTORE_PASSWORD}" && -n "${ANDROID_KEY_ALIAS}" && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            {
              echo "ANDROID_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
            } >> "$GITHUB_ENV"
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release signing secrets not configured; falling back to ephemeral debug keystore (not upgradeable across CI runs)."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Tyranor-Next-EasyRPG.apk

      - name: Verify release APK ELF and versionCode
        run: |
          ./scripts/verify_release_apk.sh dist/Tyranor-Next-EasyRPG.apk
          expected_code="${{ needs.detect-version-change.outputs.version_code }}"
          expected_name="${{ needs.detect-version-change.outputs.version_name }}"
          aapt2="${ANDROID_HOME}/build-tools/36.0.0/aapt2"
          badging="$("${aapt2}" dump badging dist/Tyranor-Next-EasyRPG.apk)"
          actual_code="$(printf '%s\n' "${badging}" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n 1)"
          actual_name="$(printf '%s\n' "${badging}" | sed -nE "s/.*versionName='([^']+)'.*/\1/p" | head -n 1)"
          if [[ "${actual_code}" != "${expected_code}" || "${actual_name}" != "${expected_name}" ]]; then
            echo "::error::APK version mismatch: actual=${actual_name}(${actual_code}), expected=${expected_name}(${expected_code})"
            exit 1
          fi
          echo "Verified APK versionName=${actual_name}, versionCode=${actual_code}."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: easyrpg-host-${{ needs.detect-version-change.outputs.version_name }}
          VERSION_NAME: ${{ needs.detect-version-change.outputs.version_name }}
          VERSION_CODE: ${{ needs.detect-version-change.outputs.version_code }}
          SIGN_MODE: ${{ steps.signing.outputs.signed }}
        run: |
          NOTES="EasyRPG host APK ${VERSION_NAME} (versionCode ${VERSION_CODE}), commit ${GITHUB_SHA}."
          if [[ "${SIGN_MODE}" != "release" ]]; then
            NOTES="${NOTES}"$'\n\n'"Note: Signed with ephemeral CI debug keystore (release keystore secrets not yet configured; configure ANDROID_KEYSTORE_* secrets for in-place upgrade compatibility)."
          fi

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/Tyranor-Next-EasyRPG.apk --clobber
          else
            gh release create "${TAG_NAME}" dist/Tyranor-Next-EasyRPG.apk \
              --target "${GITHUB_SHA}" \
              --title "Tyranor-Next-EasyRPG ${VERSION_NAME}" \
              --notes "${NOTES}"
          fi
